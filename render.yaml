services:
- type: web
  name: my-laravel-app
  env: docker
  dockerfilePath: ./Dockerfile
  envVars:
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: "false"
  - key: APP_URL
    value: https://my-laravel-app.onrender.com
  - key: APP_KEY
    generateValue: true
  - key: LOG_CHANNEL
    value: stderr
  - key: DB_CONNECTION
    value: mysql
  - key: DB_HOST
    value: ""
  - key: DB_PORT
    value: ""
  - key: DB_DATABASE
    value: ""
  - key: DB_USERNAME
    value: ""
  - key: DB_PASSWORD
    value: ""
  - key: QUEUE_CONNECTION
    value: sync

databases:
- name: my-laravel-db
  databaseName: my_database
  user: db_user
  plan: free